{% for g in guilds %}
    {% set hand = 'dashboard(this)' if g['id'] in ver_guilds else 'register(this)' %}
    {% set isown = 'Owner' if g['owner'] else 'Manager Server' %}
    <div class="page-server" onclick="{{hand}}" id="{{g['id']}}">
        <div class="server-avatar-back" style="background: url(https://cdn.discordapp.com/icons/{{g['id']}}/{{g['icon']}}.webp?size=240);">
            <div class="serever-avatar-back-blur">
                <div class="server-avatar">
                    <img class="server-avatar-ico" src="https://cdn.discordapp.com/icons/{{g['id']}}/{{g['icon']}}.webp?size=240"><!-- АВА СЕРВЕРА -->
                </div>
            </div>
        </div>
        <div class="server-info">
            <div class="server-about">
                <h1 class="server-name">{{g['name']}}</h1> <!-- НАЗВАНИЕ СЕРВЕРА -->
                <h1 class="bot-name">{{isown}}</h1>
            </div>
            <div class="server-go-button">
                {% if g['id'] in ver_guilds %}
                    <h1 class="server-go-button-text">Go</h1>
                {% else %}
                    <h1 class="server-go-button-text">Setup</h1>
                {% endif %}
            </div>
        </div>
    </div>
{% endfor %}
