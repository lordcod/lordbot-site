<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/home.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    {% block archive %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="menu">
            <div class="menu-bot-icon">
                <div class="bot-icon"></div>
            </div>
            <div class="menu-buttons">
                <div class="menu-button">
                    <a id="home-menu-button" href="#">
                        <span class="material-symbols-outlined">
                            home
                        </span>
                    </a>
                    </div>
                <div class="menu-button">
                    <a id="home-servers-button" href="#">
                        <span class="material-symbols-outlined">
                            dns
                        </span>
                    </a>
                    </div>
                <div class="menu-button">
                    <a id="home-settings-button" href="#">
                        <span class="material-symbols-outlined">
                            settings
                        </span>
                    </a>
                    </div>
                <div class="menu-button">
                    <a href="#">
                        <span class="material-symbols-outlined">
                            help
                        </span>
                    </a>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="home-page-title">
                <div class="text-home">Rune / Home</div>
                <div class="title-buttons">
                    <div class="title-button">
                        <a href="#">
                            <span class="title-button-text">
                                Status
                            </span>
                        </a>
                    </div>
                    <div class="title-button">
                        <a href="#">
                            <span class="title-button-text">
                                Support
                            </span>
                        </a>
                    </div>
                    <div class="title-button">
                        <a href="#">
                            <span class="title-button-text">
                                Profile
                            </span>
                        </a>
                    </div>
                </div>
            </div>
            <div class="home-page-content">
                {% block home_content %}{% endblock %}
            </div>
            <footer class="footer">
                <div class="footer-content">Я футер</div>
            </footer>
        </div>
    </div>
</body>
</html>
